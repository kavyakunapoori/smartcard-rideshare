# -----------------------------------------------------------------------------
# Smart Carpool and Ride Sharing System - Application Configuration
# -----------------------------------------------------------------------------

# Server Configuration (Render binds to $PORT dynamically)
server.port=${PORT:8080}
server.servlet.context-path=

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/smart_carpool?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:kavya2101}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway Migrations (Safe fallback if schema auto-generation or migration)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:smartcarpooljwtsecretkey2026supersecuredefaultsigningkeywithmin256bitslength}
app.jwt.expiration-ms=86400000

# CORS Allowed Origins (Comma-separated for local Vite, production Vercel, etc.)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Jackson JSON Formatter
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Logging
logging.level.com.smartcarpool.system=INFO
logging.level.org.springframework.security=WARN
