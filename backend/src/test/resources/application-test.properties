# Test Configuration with isolated in-memory H2 database in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

app.jwt.secret=testsecretkeyforunitandintegrationtestingpurposesonlymin256bitslong12345
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:5173
