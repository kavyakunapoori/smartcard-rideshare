services:
  # Spring Boot Java Backend Web Service
  - type: web
    name: smart-carpool-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      # Hosted MySQL Database Configuration
      # Enter your hosted MySQL provider details (e.g., Aiven, TiDB Cloud, Railway, AWS RDS)
      # in the Render Dashboard Environment settings
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: http://localhost:5173
